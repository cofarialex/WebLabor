<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web-CV</title>
  <style>
    /* Sötét alaptéma beállítása */
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 800px;
    }

    /* Profilkártya stílusok */
    .profile-card {
      display: flex;
      gap: 18px;
      align-items: center;
      background: #11161d;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .profile-card .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #1f2937;
    }

    .profile-card .name {
      margin: 0;
      font-size: 28px;
      color: #ffffff;
    }

    .profile-card .role {
      margin: 4px 0 8px;
      color: #9aa4b2;
    }

    .profile-card .links a {
      color: #e6e9ef;
      text-decoration: none;
      margin-right: 8px;
    }

    .profile-card .links a:hover {
      text-decoration: underline;
    }

    /* Elfogadási kritérium: Reszponzivitás 600px alatt a kép a név fölé kerül */
    @media (max-width: 600px) {
      .profile-card {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <main id="app">
    <section class="profile-card">
      <img class="avatar" src="https://picsum.photos/200" alt="Profilkép" />
      <div class="meta">
        <h1 class="name">Cofar Alex</h1>
        <p class="role">Informatikus hallgató · Webfejlesztés</p>
        <div class="links">
          <a href="mailto:alex.cofar@example.com">Email</a> ·
          <a href="https://linkedin.com">LinkedIn</a> ·
          <a href="https://github.com/cofarialex">GitHub</a>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
